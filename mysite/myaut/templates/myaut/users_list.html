{% extends "shopapp/base.html" %}

{% block title %}Пользователи{% endblock %}

{% block body %}
    <div class="card">
        <h1>👥 Все пользователи</h1>
        <ul>
            {% for user in users %}
                <li style="display: flex; align-items: center; gap: 15px; padding: 12px 0;">
                    {% if user.profile.avatar %}
                        <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="avatar" style="width: 48px; height: 48px;">
                    {% else %}
                        <div style="width: 48px; height: 48px; background: #e0e0e0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
                    {% endif %}
                    <a href="{% url 'myaut:user_profile' pk=user.pk %}" style="font-size: 18px;">
                        <strong>{{ user.username }}</strong>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}

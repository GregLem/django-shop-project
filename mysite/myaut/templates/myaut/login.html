{% extends "shopapp/base.html" %}

{% block title %}Login{% endblock %}

{% block body %}
    <div class="card">
        <h1>Login</h1>

        {% if form.errors %}
            <p style="color: red;">Неверный логин или пароль.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <p>Нет аккаунта? <a href="{% url 'myaut:register' %}">Зарегистрироваться</a></p>
    </div>
{% endblock %}

{% extends "shopapp/base.html" %}

{% block title %}
    Create Order
{% endblock %}

{% block body %}
    <h1>Create Order</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Order</button>
    </form>
    
    <div>
        <a href="{% url 'shopapp:order_list' %}">Back to orders list</a>
    </div>
{% endblock %}

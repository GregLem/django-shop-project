<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}
            Base title
           {% endblock  %}
    </title>
</head>
<body>
    {% block body %}
       Base body
    {% endblock  %}

    <div>
        {% now "H:i" %}
    </div>
    <div>
        {% now "l" as current_weekday %}
        Today is {{current_weekday}}
    </div>
<!-- Ссылка на создание продукта (только для авторизованных с правами) -->
    {% if perms.shopapp.add_product %}
        <div>
            <a href="{% url 'shopapp:create_product' %}">Создать продукт</a>
        </div>
    {% endif %}

</body>
</html>

{% extends "requestdattapp/base.html" %}

{% block title %}
    User Bio Form
{% endblock  %}

{% block body %}
    <h1>User Bio Form</h1>
    <div>
        <form method="post">
        {% csrf_token %}

            <p>
                <label for="name-id">Full Name:</label>
                <input id="name-id" name="name" type="text" maxlength="100">
            </p>
            <p>
                <label for="age">Age</label>
                <input id="age" name="age" type="number" min="1" max='99'>
            </p>
            <p>
                <label for="bio">Bio</label>
                <textarea name="bio" id="bio" cols="42" rows="5"></textarea>
            </p>

            <button type="submit">
                Submit
            </button>
        </form>
    </div>

    {% if request.POST %}
        <div>
            <h2>Submitted Data</h2>
            <table>
                <tr>
                    <td>Name</td>
                    <td>{{ request.POST.name }}</td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td>{{ request.POST.age }}</td>
                </tr>
                <tr>
                    <td>Bio</td>
                    <td>
                        <p>{{ request.POST.bio|linebreaks }}</p>

                    </td>
                </tr>
            </table>
        </div>
    {% endif %}
{% endblock  %}
